# PostgreSQL for the isolation specs.
#
# A dedicated instance rather than a shared development cluster, because the specs are
# not polite guests: they create roles, drop tables and rewrite policies on every run.
# Roles in particular are cluster-wide objects, so a role created "for the test database"
# is in fact an account on the whole server, visible from every database on it.
#
# No volume on purpose — the specs build everything they need, so this container holds
# nothing worth keeping and can be removed at any time.
services:
  postgres:
    image: postgres:18-alpine
    container_name: pg-tenant-rls-test
    environment:
      # No "pg_" prefix — PostgreSQL reserves that namespace for role names, and initdb
      # refuses to create a superuser called pg_anything.
      POSTGRES_USER: tenant_rls
      POSTGRES_PASSWORD: tenant_rls
      POSTGRES_DB: postgres
    ports:
      - "5434:5432"
    # Mounted at /var/lib/postgresql, not /var/lib/postgresql/data: the official image
    # moved PGDATA to /var/lib/postgresql/<major>/docker in 18, and a mount on the old
    # path makes the entrypoint refuse to start ("unused mount/volume").
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenant_rls"]
      interval: 2s
      timeout: 3s
      retries: 15
